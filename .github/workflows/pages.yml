name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Shortest schedule GitHub allows. The browser refresh interval is separate and can be faster.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Publish pair snapshot
        run: npx tsx scripts/snapshot.ts

      - name: Build
        env:
          PAGES_EXPORT: "1"
          NEXT_PUBLIC_PAGES: "1"
        run: |
          rm -rf app/api
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
